name: leccheck
description: "LecCheck — track lectures, practices and labs you attend during the semester."
publish_to: 'none'
version: 2.0.0+12

environment:
  sdk: ^3.13.5

dependencies:
  animations: ^3.0.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_ui: ^1.1.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.0.2
  home_widget: ^0.10.0
  http: ^1.6.0
  intl: ^0.20.3
  kosher_dart: ^2.0.20
  material_color_utilities: ^0.13.0
  material_ui: ^1.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: LecIcons
      fonts:
        - asset: assets/fonts/LecIcons.ttf

# Generated app icons: `dart run flutter_launcher_icons` (sources in design/app-icon)
flutter_launcher_icons:
  image_path: assets/branding/icon_full.png
  android: true
  adaptive_icon_background: assets/branding/background.png
  adaptive_icon_foreground: assets/branding/foreground.png
  adaptive_icon_monochrome: assets/branding/monochrome.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/icon_rounded.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/icon_rounded.png

# Native splash: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F7F8FC"
  color_dark: "#111318"
  image: assets/branding/splash.png
  android_12:
    image: assets/branding/foreground.png
    icon_background_color: "#4F66D2"
    color: "#F7F8FC"
    color_dark: "#111318"
  web: false
