name: Release

# Push a tag like v2.0.0 to build every platform and publish a GitHub Release.
#
# Repository settings needed:
#   Variables: API_BASE_URL (your Worker URL, e.g. https://leccheck-sync.you.workers.dev)
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, UPDATE_SIGNING_KEY,
#              FLATPAK_GPG_KEY, and the server deploy secrets (deploy-server.yml)
#   Pages:     source "GitHub Actions"; the github-pages environment lets v* tags
#              deploy (docs/SETUP.md)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6
  DEFINES: --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; APKs are debug-signed."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: flutter pub get
      # Android shows the full tag (e.g. 2.0.0-beta.1); iOS only allows numbers.
      - run: flutter build apk --release --split-per-abi $DEFINES --build-name="${GITHUB_REF_NAME#v}"
      - run: flutter build apk --release $DEFINES --build-name="${GITHUB_REF_NAME#v}"
      - name: Collect
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/LecCheck-$V-android.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../out/LecCheck-$V-android-arm64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The full tag (e.g. 2.0.0-beta.1), like Android: About shows it, and the
      # update notice reads the channel from it.
      - run: flutter build linux --release $DEFINES --build-name="${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          P="LecCheck-$V-linux-x64"
          mkdir -p "../out/$P/icons"
          cp -r build/linux/x64/release/bundle "../out/$P/bundle"
          cp linux/assets/com.leccheck.app-*.png "../out/$P/icons/"
          cp linux/packaging/* "../out/$P/"
          cp ../scripts/linux-install.sh "../out/$P/install.sh"
          tar -C ../out -czf "../out/$P.tar.gz" "$P"
          rm -rf "../out/$P"
          # For the Flatpak job (a tarball keeps the files' permissions).
          mkdir -p ../flatpak-bundle
          tar -C build/linux/x64/release -czf ../flatpak-bundle/bundle.tar.gz bundle
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: flatpak-bundle/

  # The Flatpak, from the Linux bundle above, into LecCheck's own repository
  # (GPG-signed, served by GitHub Pages): built in Flathub's container, which
  # has flatpak-builder and the freedesktop SDK.
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle
      - run: mkdir -p app/build/linux/x64/release && tar -xzf bundle.tar.gz -C app/build/linux/x64/release
      # What's new in software centers: the newest CHANGELOG sections.
      - run: python3 scripts/metainfo_releases.py
      - name: Signing key
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_KEY" ]; then
            echo "::error::The FLATPAK_GPG_KEY secret is missing: Flatpak refuses an unsigned repository"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build and sign
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --default-branch=stable \
            --repo=repo --gpg-sign="$GPG_KEY" --gpg-homedir="$GNUPGHOME" \
            build app/linux/flatpak/com.leccheck.app.yml
          # The summary (signed), and deltas so updates download less. Each
          # release publishes a fresh repository with only the new version:
          # Flatpak fetches just the files that changed.
          flatpak build-update-repo --gpg-sign="$GPG_KEY" --gpg-homedir="$GNUPGHOME" \
            --generate-static-deltas --title=LecCheck repo
      - name: The site
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          python3 scripts/flatpak_site.py repo site app/linux/flatpak/leccheck-repo.asc \
            "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Unsigned: AltStore / SideStore re-sign it with your own Apple ID.
      - run: flutter build ios --release --no-codesign $DEFINES
      - name: Package IPA
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p Payload ../out
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "../out/LecCheck-$V-ios.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/

  # The sync server for this commit must be live and healthy before an app
  # that may depend on it is published (a no-op when it already is).
  server:
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit

  publish:
    needs: [android, linux, flatpak, ios, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      pages: write # publish the Flatpak repository
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: AltStore / SideStore source and release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          # The release's title, like every other place the version is shown
          # (changelog, file names, the app's update notice): no "v".
          echo "V=$V" >> "$GITHUB_ENV"
          # AltStore compares this with the IPA's numeric CFBundleShortVersionString.
          APP_VERSION="$(grep -E '^version:' app/pubspec.yaml | sed -E 's/version: *([^+]*)\+.*/\1/')"
          BUILD="$(grep -E '^version:' app/pubspec.yaml | sed 's/.*+//')"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases"
          IPA="out/LecCheck-$V-ios.ipa"
          python3 scripts/altstore_source.py "$APP_VERSION" "$BUILD" "$IPA" \
            "$BASE/download/${GITHUB_REF_NAME}/LecCheck-$V-ios.ipa" "$V" > out/altstore-source.json
          # The altstore branch always holds the newest source (see the last step).
          SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/altstore/altstore-source.json"
          FLATPAKREF="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/leccheck.flatpakref"
          echo "FLATPAKREF=$FLATPAKREF" >> "$GITHUB_ENV"
          if [[ "$V" == *-* ]]; then
            BETA=$'> **Beta.** Not yet verified on every device: reminders and their buttons, the Android widget and the iPhone build. Please report problems in Issues.\n'
            OBTAINIUM=' Turn on **Include prereleases** to get betas.'
          else
            BETA=''
            OBTAINIUM=''
          fi
          # This version's CHANGELOG section: the apps' "What's new" opens this page.
          CHANGES="$(awk -v h="## $V " 'index($0,h)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)"
          if [[ -n "${CHANGES//[[:space:]]/}" ]]; then
            CHANGES=$'## What\'s new\n'"${CHANGES}"$'\n'
          else
            CHANGES=''
          fi
          cat > notes.md <<EOF
          ${BETA}
          ${CHANGES}
          ## Downloads
          - **Android**: \`LecCheck-$V-android-arm64.apk\` for most phones, or the universal \`LecCheck-$V-android.apk\`.
            Tip: add this repo to [Obtainium](https://obtainium.imranr.dev) for automatic updates.${OBTAINIUM}
          - **iPhone**: in AltStore or SideStore, add this source:
            \`$SOURCE\`
          - **Linux**: install the Flatpak, then it updates itself:
            \`flatpak install --user $FLATPAKREF\`
            (or open [leccheck.flatpakref]($FLATPAKREF) in your software center). Installed with
            \`install.sh\` before? Update from inside LecCheck, then choose **Move to the Flatpak**.
          EOF
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: LecCheck ${{ env.V }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: notes.md
          files: out/*
      # The Flatpak repository goes live before update.json announces the
      # release (the Flatpak updates itself from it).
      - name: Publish the Flatpak repository (GitHub Pages)
        id: pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/deploy-pages@v5
      # GitHub's "latest" release links skip pre-releases, so AltStore / SideStore
      # read the source from the altstore branch, which always has the newest one.
      # update.json there tells the Android and Linux apps about new releases
      # (with each file's SHA-256, so they can install it themselves). It's
      # signed (update.json.sig, Ed25519): the apps ignore it otherwise.
      - name: Update the AltStore / SideStore source and update.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is missing: apps would ignore an unsigned update.json"
            exit 1
          fi
          V="${GITHUB_REF_NAME#v}"
          BUILD="$(grep -E '^version:' app/pubspec.yaml | sed 's/.*+//')"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin altstore
          git worktree add --detach "$RUNNER_TEMP/altstore" FETCH_HEAD
          cp out/altstore-source.json "$RUNNER_TEMP/altstore/"
          python3 scripts/update_manifest.py "$RUNNER_TEMP/altstore/update.json" "$V" "$BUILD" \
            "https://github.com/${GITHUB_REPOSITORY}" out "$FLATPAKREF" > "$RUNNER_TEMP/update.json"
          mv "$RUNNER_TEMP/update.json" "$RUNNER_TEMP/altstore/update.json"
          ( umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/signing-key.pem" )
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/signing-key.pem" \
            -in "$RUNNER_TEMP/altstore/update.json" | base64 -w0 > "$RUNNER_TEMP/altstore/update.json.sig"
          rm "$RUNNER_TEMP/signing-key.pem"
          cd "$RUNNER_TEMP/altstore"
          git add altstore-source.json update.json update.json.sig
          git commit -m "LecCheck ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:refs/heads/altstore
