name: Release

# Push a tag like v2.0.0 to build every platform and publish a GitHub Release.
#
# Repository settings needed:
#   Variables: API_BASE_URL (your Worker URL, e.g. https://leccheck-sync.you.workers.dev)
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6
  DEFINES: --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; APKs are debug-signed."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi $DEFINES
      - run: flutter build apk --release $DEFINES
      - name: Collect
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/LecCheck-$V-android.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../out/LecCheck-$V-android-arm64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release $DEFINES
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          P="LecCheck-$V-linux-x64"
          mkdir -p "../out/$P/icons"
          cp -r build/linux/x64/release/bundle "../out/$P/bundle"
          cp linux/assets/com.leccheck.app-*.png "../out/$P/icons/"
          cp linux/packaging/* "../out/$P/"
          cp ../scripts/linux-install.sh "../out/$P/install.sh"
          tar -C ../out -czf "../out/$P.tar.gz" "$P"
          rm -rf "../out/$P"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Unsigned: AltStore / SideStore re-sign it with your own Apple ID.
      - run: flutter build ios --release --no-codesign $DEFINES
      - name: Package IPA
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p Payload ../out
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "../out/LecCheck-$V-ios.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/

  publish:
    needs: [android, linux, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: AltStore / SideStore source
        run: |
          V="${GITHUB_REF_NAME#v}"
          BUILD="$(grep -E '^version:' app/pubspec.yaml | sed 's/.*+//')"
          IPA="out/LecCheck-$V-ios.ipa"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/LecCheck-$V-ios.ipa"
          python3 scripts/altstore_source.py "$V" "$BUILD" "$IPA" "$URL" > out/altstore-source.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: LecCheck ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            ## Downloads
            - **Android**: `LecCheck-*-android.apk` (or the smaller `-arm64` build for most phones).
              Tip: install [Obtainium](https://obtainium.imranr.dev) and add this repo for automatic updates.
            - **iPhone**: add this source in AltStore or SideStore once:
              `https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json`
            - **Linux**: extract `LecCheck-*-linux-x64.tar.gz` and run `./install.sh`.
